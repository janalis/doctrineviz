name: release-checks
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate without publishing
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
  actions: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # GITHUB_TOKEN pushes do not trigger push workflows. A dispatch does,
      # and attaches CI checks to the generated release commit itself.
      - name: Run CI for the release tag and require success
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Expected a release tag in vX.Y.Z format.'
            exit 1
          fi
          run_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -H 'X-GitHub-Api-Version: 2026-03-10' -f ref="$TAG" --jq '.workflow_run_id')
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo '::error::GitHub did not return a CI workflow run ID.'
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
