name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        symfony: ['7.4.*', '8.0.*', '8.1.*']
        dependencies: [highest]
        include:
          - php: '8.5'
            symfony: '7.4.*'
            dependencies: lowest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, dom
          coverage: none
          tools: composer:v2
      - run: sudo apt-get update -qq && sudo apt-get install -y graphviz
      - name: Select Symfony series
        env:
          SYMFONY_VERSION: ${{ matrix.symfony }}
        run: python3 tools/ci-dependencies.py "$SYMFONY_VERSION"
      - name: Resolve dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = lowest ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
          else
            composer update --no-interaction --prefer-dist
          fi
      - run: make test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: make validate
      - run: make audit
      - run: make fmt-check
      - run: make lint
      - run: make analyze
      - run: make test-release

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, dom
          coverage: pcov
          tools: composer:v2
      - run: sudo apt-get update -qq && sudo apt-get install -y graphviz
      - run: composer install --no-interaction --prefer-dist
      - run: make coverage
      - run: make infection
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: |
            var/infection.log
            var/infection-summary.log

  mariadb:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: doctrineviz_test
          MARIADB_USER: doctrineviz
          MARIADB_PASSWORD: synthetic-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-root-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: sudo apt-get update -qq && sudo apt-get install -y graphviz
      - run: composer install --no-interaction --prefer-dist
      - run: make test
        env:
          DOCTRINEVIZ_TEST_DATABASE_URL: mysql://doctrineviz:synthetic-ci-only@127.0.0.1:3306/doctrineviz_test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: make docs
      - run: npm audit --prefix docs

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate GitHub workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --dir "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_1.7.12_checksums.txt' --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          make workflows ACTIONLINT="$RUNNER_TEMP/actionlint/actionlint"

  success:
    if: always()
    needs: [tests, quality, mutation, mariadb, docs, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = success,success,success,success,success,success
