php-version = "8.4.0"

[source]
paths = ["src", "tests", "tools"]
includes = ["vendor"]

[formatter]
print-width = 120

[linter]
integrations = ["symfony", "phpunit"]

# Keep formatting policy separate from heuristic complexity estimates.
[linter.rules.cyclomatic-complexity]
threshold = 30
[linter.rules.kan-defect]
enabled = false
[linter.rules.halstead]
enabled = false
[linter.rules.excessive-parameter-list]
threshold = 7
[linter.rules.literal-named-argument]
enabled = false
[linter.rules.no-boolean-flag-parameter]
enabled = false
[linter.rules.assertion-style]
style = "self"
